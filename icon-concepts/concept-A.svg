<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#111c42"/>
      <stop offset="55%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- ∞ 双环：外缘圆 + 内缘偏心圆，evenodd 挖洞 → 外侧厚(44px) 中心侧薄(14px) 的渐变粗细 -->
  <defs>
    <linearGradient id="ringG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <g fill="url(#ringG)" fill-rule="evenodd">
    <!-- 左环 -->
    <path d="M 31,256 A 122,122 0 1 0 275,256 A 122,122 0 1 0 31,256 Z
             M 75,256 A 93,93 0 1 1 261,256 A 93,93 0 1 1 75,256 Z"/>
    <!-- 右环（镜像） -->
    <path d="M 481,256 A 122,122 0 1 0 237,256 A 122,122 0 1 0 481,256 Z
             M 437,256 A 93,93 0 1 1 251,256 A 93,93 0 1 1 437,256 Z"/>
  </g>

  <!-- 环上缘高光弧（光从上方来，最便宜的体积感） -->
  <g fill="none" stroke="#e0faff" stroke-linecap="round" opacity="0.5">
    <path d="M 62,214 A 118,118 0 0 1 176,142" stroke-width="9"/>
    <path d="M 450,214 A 118,118 0 0 0 336,142" stroke-width="9"/>
  </g>

  <!-- 中央：隔离层 → 菱形能量核（AE2 四棱晶体感） -->
  <circle cx="256" cy="256" r="96" fill="#07303f" opacity="0.92"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.6"/>
  <defs>
    <linearGradient id="coreG" x1="0.2" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#cff8ff"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0b5e75"/>
    </linearGradient>
  </defs>
  <path d="M 256,180 L 340,256 L 256,332 L 172,256 Z" fill="url(#coreG)"/>
  <path d="M 256,214 L 292,256 L 256,298 L 220,256 Z" fill="#ffffff" opacity="0.30"/>
  <circle cx="256" cy="248" r="7" fill="#ffffff"/>
</svg>