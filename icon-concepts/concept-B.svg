<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#111c42"/>
      <stop offset="55%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 星野 -->
  <g fill="#dbe9ff">
    <circle cx="72" cy="92" r="1.6" opacity="0.8"/>
    <circle cx="168" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="442" cy="120" r="1.8" opacity="0.7"/>
    <circle cx="410" cy="420" r="1.3" opacity="0.6"/>
    <circle cx="60" cy="356" r="1.2" opacity="0.55"/>
    <circle cx="330" cy="470" r="1.5" opacity="0.7"/>
    <circle cx="120" cy="452" r="1.0" opacity="0.5"/>
    <circle cx="470" cy="300" r="1.2" opacity="0.5"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <path d="M 415,58 L 417.5,66 L 425,68.5 L 417.5,71 L 415,79 L 412.5,71 L 405,68.5 L 412.5,66 Z"/>
    <path d="M 92,300 L 94.2,306 L 100,308.2 L 94.2,310.5 L 92,316 L 89.8,310.5 L 84,308.2 L 89.8,306 Z"/>
  </g>

  <!-- 吸积盘：斜椭圆环带，径向渐变 白热内→金→橙→深红（热量从中心向外递减） -->
  <defs>
    <radialGradient id="diskG" gradientUnits="userSpaceOnUse" cx="236" cy="238" r="200">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="22%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="78%" stop-color="#e0522a"/>
      <stop offset="100%" stop-color="#6d130a"/>
    </radialGradient>
  </defs>
  <g fill="url(#diskG)" fill-rule="evenodd">
    <path d="M 88,256 A 168,108 0 1 0 424,256 A 168,108 0 1 0 88,256 Z
             M 130,256 A 126,76 0 1 1 382,256 A 126,76 0 1 1 130,256 Z"/>
  </g>

  <!-- 光子环：黑洞上方的拱形白弧（引力透镜特效的核心） -->
  <g fill="none" stroke-linecap="round">
    <path d="M 118,318 A 196,118 0 0 1 394,318" stroke="#ff9c5b" stroke-width="14" opacity="0.35"/>
    <path d="M 108,322 A 204,128 0 0 1 404,322" stroke="#ffd9a8" stroke-width="6" opacity="0.75"/>
    <path d="M 112,318 A 200,122 0 0 1 400,318" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
  </g>

  <!-- 事件视界：纯黑，留出「洞」的负空间 -->
  <circle cx="256" cy="256" r="82" fill="#000000"/>
  <circle cx="256" cy="256" r="82" fill="none" stroke="#0a0f24" stroke-width="2"/>
</svg>