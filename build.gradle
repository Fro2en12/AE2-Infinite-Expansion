plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

base {
    archivesName = 'ae2-addon'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.247'

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        data {
            data()
            programArguments.addAll '--mod', 'ae2addon', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        ae2addon {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    mavenCentral()
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.247"

    // Mixin 注解处理器（NeoForge 1.21 运行时自带 Mixin 0.8.7）
    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    // 拼音搜索支持 — 嵌入到mod jar中
    embed 'com.belerweb:pinyin4j:2.5.1'

    // AE2 19.2.17 for NeoForge 1.21.1 — 通过 Modrinth Maven 获取
    implementation "maven.modrinth:ae2:19.2.17"
    implementation "maven.modrinth:guideme:21.1.17"

    // JEI 19.43.0.390 for 1.21.1 NeoForge
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"

    // AppliedE 1.0.8-beta（NeoForge 1.21.1）— EMC 通道注册（编译+运行）
    compileOnly "maven.modrinth:appliede:1.0.8-beta"
    runtimeOnly "maven.modrinth:appliede:1.0.8-beta"
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title"     : "AE2 Addon — Infinite Expansion",
                "Specification-Vendor"    : "Tendo Alice",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Tendo Alice",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
