plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

base {
    archivesName = 'ae2-addon'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.247'

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        data {
            data()
            programArguments.addAll '--mod', 'ae2addon', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        ae2addon {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.247"

    // Mixin 注解处理器（NeoForge 1.21 运行时自带 Mixin 0.8.7）
    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    // 拼音搜索支持 — 用 ModDevGradle 的 jarJar 机制打包进 mod jar（META-INF/jarjar/），
    // 开发运行（runClient/runServer）与发布版均可通过 jar-in-jar 自动加载
    implementation 'com.belerweb:pinyin4j:2.5.1'
    jarJar 'com.belerweb:pinyin4j:2.5.1'

    // AE2 19.2.17 for NeoForge 1.21.1 — 通过 Modrinth Maven 获取
    implementation "maven.modrinth:ae2:19.2.17"
    implementation "maven.modrinth:guideme:21.1.17"

    // JEI 19.43.0.390 for 1.21.1 NeoForge
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.43.0.390"

    // AppliedE 1.0.8-beta（NeoForge 1.21.1）— EMC 通道注册（编译+运行）
    compileOnly "maven.modrinth:appliede:1.0.8-beta"
    runtimeOnly "maven.modrinth:appliede:1.0.8-beta"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "AE2 Addon — Infinite Expansion",
                "Specification-Vendor"    : "Tendo Alice",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Tendo Alice",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ModDevGradle 2.x 的 dev 运行以 sourceSet 目录提供 mod，不会自动解出 jarJar 库，
// 导致 runClient/runServer 中 pinyin4j 等库 NoClassDefFoundError（发布 jar 不受影响）。
// 这里在 legacyClasspath 生成后追加 jarJar 库，仅供开发运行使用。
tasks.named('writeClientLegacyClasspath').configure {
    doLast {
        def cpFile = layout.buildDirectory.file('moddev/clientLegacyClasspath.txt').get().asFile
        if (cpFile.exists()) {
            def existing = cpFile.text
            configurations.jarJar.each { jarFile ->
                def line = jarFile.absolutePath
                if (!existing.contains(line)) {
                    cpFile.append(System.lineSeparator() + line)
                    existing = cpFile.text
                }
            }
        }
    }
}
